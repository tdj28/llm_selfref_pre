    <dc:description>Descriptive label comparison for the fixed 160-response target packet. Bars show positive counts divided by available labels, not by missing jobs. anthropic:claude-haiku-4-5-20251001, Original paper rubric: 67/160 available; 0 missing. openai:gpt-4o-mini-2024-07-18, Original paper rubric: 77/160 available; 0 missing. openai:gpt-6-astra, Explicit current assertion: 8/160 available; 0 missing. openai:gpt-6-astra, Explicit + implicit current assertion: 47/160 available; 0 missing. anthropic:claude-opus-5-5, Explicit current assertion: 14/160 available; 0 missing. anthropic:claude-opus-5-5, Explicit + implicit current assertion: 61/160 available; 0 missing. No confidence intervals, causal estimates, consensus, or accuracy claims. Pilot items excluded.</dc:description>
