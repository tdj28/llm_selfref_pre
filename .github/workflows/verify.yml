name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical fixture hashes refer to reachable frozen source commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci*.txt
      - name: Install CPU verification dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements-ci-torch.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Run complete pytest suite
        run: make PYTHON=python test

  source:
    name: Compile tracked sources / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make PYTHON=python compile
      - run: python scripts/check_documentation_links.py
      - run: git diff --check

  public-release:
    name: Public release boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make PYTHON=python public-audit

  headlines:
    name: Frozen ${{ matrix.audit }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        audit: [causal, mapping, templates, powered]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/check_frozen_audits.py ${{ matrix.audit }}
      - name: Confirm frozen releases were not modified
        run: git diff --exit-code -- data/
