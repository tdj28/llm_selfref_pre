[project]
name = "sae-steering"
version = "0.1.0"
description = "SAE Steering Research Framework for LLMs"
requires-python = ">=3.10"
dependencies = [
    # Core ML/AI
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.42.0",

    # SAE specific
    "nnsight==0.3.0",
    "huggingface-hub>=0.20.0",
    "hf-transfer>=0.1.0",

    # LLM APIs
    "openai>=1.0.0",
    "anthropic>=0.25.0",

    # Data science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.0.0",

    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",

    # Utilities
    "tqdm>=4.60.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
